name: Early Light
description: Scan for emerging vulnerabilities with DefectDojo's Early Light engine and report SARIF.
author: DefectDojo
branding:
  icon: sunrise
  color: orange

inputs:
  mode:
    description: "What to scan: fs, image, repo or host."
    default: repo
  target:
    description: "What to scan: a path (fs, repo), an image reference (image) or a host (host). Several targets are separated by spaces."
    default: "."
  detector:
    description: "Run only these detectors (comma-separated, for example php2shell). Empty runs every detector that supports the mode."
    default: ""
  args:
    description: "Extra command-line flags, for example --platform all or --public-registries-only."
    default: ""
  sarif:
    description: "Where to write the SARIF report."
    default: earlylight.sarif
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning (needs security-events: write)."
    default: "false"
  fail-on:
    description: "When to fail the step: vulnerable (exit 1), unknown (exit 1 or 3), or never."
    default: vulnerable
  version:
    description: "Early Light release to run, for example v0.2.0. Empty uses the release this action is pinned to, or the latest release."
    default: ""

outputs:
  sarif:
    description: Path of the SARIF report.
    value: ${{ steps.scan.outputs.sarif }}
  exit-code:
    description: "Early Light's exit status: 0 nothing vulnerable or unknown, 1 vulnerable, 2 error, 3 unknown."
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install Early Light
      shell: bash
      env:
        EARLYLIGHT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        EARLYLIGHT_BIN_DIR: ${{ runner.temp }}/earlylight-bin
      run: |
        set -euo pipefail
        if [ -z "$EARLYLIGHT_VERSION" ] && [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          export EARLYLIGHT_VERSION="$ACTION_REF"
        fi
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "::error::The Early Light action runs on Linux and macOS runners." && exit 2
        fi
        sh "$GITHUB_ACTION_PATH/install.sh"
        echo "$EARLYLIGHT_BIN_DIR" >> "$GITHUB_PATH"
    - name: Scan
      id: scan
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        TARGET: ${{ inputs.target }}
        DETECTOR: ${{ inputs.detector }}
        ARGS: ${{ inputs.args }}
        SARIF: ${{ inputs.sarif }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -uo pipefail
        case "$MODE" in fs|image|repo|host) ;; *) echo "::error::mode must be fs, image, repo or host" && exit 2 ;; esac
        cmd=(earlylight scan "$MODE" --format sarif --output "$SARIF")
        [ -n "$DETECTOR" ] && cmd+=(--detector "$DETECTOR")
        set -f # split ARGS and TARGET on spaces, but never expand globs in them
        # shellcheck disable=SC2206 # ARGS and TARGET are split on purpose
        cmd+=($ARGS $TARGET)
        set +f
        "${cmd[@]}"
        code=$?
        echo "sarif=$SARIF" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if command -v jq >/dev/null 2>&1 && [ -s "$SARIF" ]; then
          {
            echo "### Early Light (exit $code)"
            echo
            echo "| Rule | Level | Location |"
            echo "| --- | --- | --- |"
            jq -r '.runs[0].results[] | "| \(.ruleId) | \(.level) | `\(.locations[0].physicalLocation.artifactLocation.uri)` |"' "$SARIF" | head -200
            jq -r '.runs[0].invocations[0].toolExecutionNotifications[]? | "\n> \(.level): \(.message.text)"' "$SARIF"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        case "$code" in
          0) exit 0 ;;
          2) echo "::error::Early Light could not complete the scan (exit 2)"; exit 2 ;;
          1) [ "$FAIL_ON" = never ] && exit 0; echo "::error::Early Light found something vulnerable"; exit 1 ;;
          3) [ "$FAIL_ON" = unknown ] && { echo "::warning::Early Light could not settle some findings"; exit 1; }; echo "::warning::Early Light could not settle some findings"; exit 0 ;;
          *) exit "$code" ;;
        esac
    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: earlylight
