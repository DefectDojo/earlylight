name: Release
on:
  push:
    # Release tags only (v0.7.0). The major tags (v0, v1) move with each release
    # and are never releases themselves, so pushing one must not start this.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release and move the major tag
      packages: write       # push the container image and its attestation
      id-token: write       # keyless signing and the provenance attestations
      attestations: write   # store the provenance attestations
    steps:
      - name: Check the tag is a release version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$GITHUB_REF_NAME is not a release tag like v0.7.0"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -race ./...
      - name: Build binaries
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            for cmd in earlylight emudhra-scan php2shell-scan; do
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
                -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "dist/${cmd}_${GITHUB_REF_NAME}_${os}_${arch}${ext}" ./cmd/$cmd
            done
          done
          # The license texts ship beside the binaries and are covered by the signed checksums.
          scripts/third-party-notices.sh "$RUNNER_TEMP/notices.txt"
          diff -u THIRD_PARTY_NOTICES.txt "$RUNNER_TEMP/notices.txt"
          cp LICENSE THIRD_PARTY_NOTICES.txt dist/
          # The detector catalog DefectDojo reads to tell which detectors this release
          # contains, also covered by the signed checksums.
          "dist/earlylight_${GITHUB_REF_NAME}_linux_amd64" detectors --format json > dist/detectors.json
          grep -q "\"version\": \"${GITHUB_REF_NAME}\"" dist/detectors.json
          (cd dist && sha256sum -- * > checksums.txt)
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      # One build provenance attestation covering every file the release attaches.
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # The image is pushed and attested before the release is published, so a
      # failure here leaves no published release without its image.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pushed by digest only: no tag names the image until it is attested.
      - name: Build and push image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/defectdojo/earlylight,push-by-digest=true,name-canonical=true,push=true
      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/defectdojo/earlylight
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # A storage record needs artifact-metadata: write; this job does not ask for it.
          create-storage-record: false
      - name: Tag image
        env:
          IMAGE: ghcr.io/defectdojo/earlylight
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          # The tags must name the attested image itself, not a copy with a new digest.
          for tag in "$GITHUB_REF_NAME" latest; do
            got=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:$tag" | jq -r .digest)
            [ "$got" = "$DIGEST" ] || { echo "::error::$IMAGE:$tag is $got, not the attested $DIGEST"; exit 1; }
          done
      # gh uploads the assets to a draft and publishes it once they are all there,
      # which is what a repository with immutable releases requires.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
      # The major tag stays a plain tag with no release, so it can keep moving
      # when releases are immutable.
      - name: Move the major tag the action is pinned to (v0, v1, ...)
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
