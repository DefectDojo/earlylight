name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: fuzz (short)
        run: |
          go test ./internal/source -run '^$' -fuzz '^FuzzTar$' -fuzztime 30s
          go test ./internal/archive -run '^$' -fuzz '^FuzzWalk$' -fuzztime 30s
          go test ./detectors/emudhra/internal/detect -run '^$' -fuzz '^FuzzScan$' -fuzztime 30s
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
